---
# Reverses containerd mirror configuration applied by k8s.containerd-mirror.up.yml:
#   1. Removes the Homelab CA from the OS trust store
#   2. Removes the docker.io mirror block from containerd config
#   3. Restarts containerd
#
# Run:
#   ansible-playbook -i inventory.yml playbooks/kubernetes/k8s.containerd-mirror.down.yml -K

- name: Remove containerd Docker Hub mirror and CA trust from K8s nodes
  hosts: k8s_control_plane:k8s_workers
  become: true

  vars:
    homelab_ca_dest: /usr/local/share/ca-certificates/homelab-ca.crt
    containerd_config: /etc/containerd/config.toml

  tasks:
    - name: Remove Homelab CA certificate from OS trust store
      ansible.builtin.file:
        path: "{{ homelab_ca_dest }}"
        state: absent

    - name: Update CA certificates
      ansible.builtin.command:
        cmd: update-ca-certificates
      changed_when: true

    - name: Remove Docker Hub mirror block from containerd config
      ansible.builtin.blockinfile:
        path: "{{ containerd_config }}"
        marker: "# {mark} HOMELAB DOCKER MIRROR"
        block: ""
        state: absent

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        daemon_reload: true

    - name: Assert containerd is active
      ansible.builtin.systemd:
        name: containerd
      register: containerd_status
      failed_when: containerd_status.status.ActiveState != "active"
