---
# Deploy ingress-nginx using the bare-metal manifest, then patch the service
# to LoadBalancer so MetalLB assigns it an IP.
- name: Install ingress-nginx
  hosts: localhost
  vars_files:
    - k8s_vars.yml

  tasks:
    - name: Apply ingress-nginx installation manifest
      ansible.builtin.shell: >
        kubectl apply -f
        https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v{{ ingress_nginx_version }}/deploy/static/provider/baremetal/deploy.yaml
      register: installation_result
      changed_when: "'created' in installation_result.stdout or 'configured' in installation_result.stdout"
      failed_when: installation_result.rc != 0

    - name: Wait for ingress-nginx controller deployment to be ready
      ansible.builtin.shell: >
        kubectl -n ingress-nginx wait
        --for=condition=available --timeout=300s
        deployment/ingress-nginx-controller
      register: controller_ready
      changed_when: false
      failed_when: controller_ready.rc != 0

    - name: Patch ingress-nginx controller to publish LoadBalancer IP as ingress address
      ansible.builtin.shell: >
        kubectl patch deployment ingress-nginx-controller -n ingress-nginx --type=json
        -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--publish-service=ingress-nginx/ingress-nginx-controller"}]'
      register: publish_patch
      changed_when: "'patched' in publish_patch.stdout"
      failed_when: publish_patch.rc != 0

    - name: Patch ingress-nginx service to LoadBalancer type for MetalLB
      ansible.builtin.shell: >
        kubectl patch svc ingress-nginx-controller -n ingress-nginx
        -p '{"spec":{"type":"LoadBalancer"}}'
      register: patch_result
      changed_when: "'patched' in patch_result.stdout"
      failed_when: patch_result.rc != 0

    - name: Wait for MetalLB to assign LoadBalancer IP
      ansible.builtin.shell: >
        kubectl get svc ingress-nginx-controller -n ingress-nginx
        -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: lb_ip
      until: lb_ip.stdout != ""
      retries: 20
      delay: 10
      changed_when: false
      failed_when: false

    - name: Show ingress-nginx LoadBalancer IP
      ansible.builtin.debug:
        msg: "ingress-nginx LoadBalancer IP: {{ lb_ip.stdout }}"
      when: lb_ip.stdout != ""

    - name: Warn if no IP assigned
      ansible.builtin.debug:
        msg: "WARNING: No LoadBalancer IP assigned — check MetalLB IP pool configuration"
      when: lb_ip.stdout == ""
