---
# Configures containerd on all K8s nodes to:
#   1. Trust the Homelab CA (so TLS connections to Nexus succeed)
#   2. Use docker-proxy.home as a pull-through mirror for docker.io
#
# Prereqs:
#   - homelab-ca.pem must exist at playbooks/kubernetes/files/homelab-ca.pem
#     (export it from OPNsense: System → Trust → Authorities → Export CA cert)
#   - task-05 (HAProxy + Unbound) must be complete before running this
#
# Run:
#   ansible-playbook -i inventory.yml playbooks/kubernetes/k8s.containerd-mirror.up.yml -K

- name: Configure containerd Docker Hub mirror and CA trust on K8s nodes
  hosts: k8s_control_plane:k8s_workers
  become: true

  vars:
    homelab_ca_src: "{{ playbook_dir }}/files/homelab-ca.pem"
    homelab_ca_dest: /usr/local/share/ca-certificates/homelab-ca.crt
    containerd_config: /etc/containerd/config.toml
    mirror_host: docker.io
    mirror_endpoint: "https://docker-proxy.home"

  pre_tasks:
    - name: Assert homelab CA file exists locally
      ansible.builtin.stat:
        path: "{{ homelab_ca_src }}"
      register: ca_file
      delegate_to: localhost
      become: false

    - name: Fail if homelab CA file is missing
      ansible.builtin.fail:
        msg: >
          homelab-ca.pem not found at {{ homelab_ca_src }}.
          Export it from OPNsense: System → Trust → Authorities → Export CA cert,
          then place it at playbooks/kubernetes/files/homelab-ca.pem.
      when: not ca_file.stat.exists

  tasks:
    - name: Distribute Homelab CA certificate to OS trust store
      ansible.builtin.copy:
        src: "{{ homelab_ca_src }}"
        dest: "{{ homelab_ca_dest }}"
        owner: root
        group: root
        mode: "0644"

    - name: Update CA certificates
      ansible.builtin.command:
        cmd: update-ca-certificates
      changed_when: true

    - name: Read current containerd config
      ansible.builtin.slurp:
        src: "{{ containerd_config }}"
      register: containerd_config_content

    - name: Assert containerd config does not already have mirror block
      ansible.builtin.assert:
        that:
          - >
            'registry.mirrors."docker.io"' not in
            (containerd_config_content.content | b64decode)
        fail_msg: >
          Mirror block for docker.io already exists in {{ containerd_config }}.
          Run k8s.containerd-mirror.down.yml first, or remove the block manually.
        success_msg: "No existing mirror block found — safe to proceed."

    - name: Add Docker Hub mirror block to containerd config
      ansible.builtin.blockinfile:
        path: "{{ containerd_config }}"
        marker: "# {mark} HOMELAB DOCKER MIRROR"
        block: |
          [plugins."io.containerd.grpc.v1.cri".registry.mirrors."{{ mirror_host }}"]
            endpoint = ["{{ mirror_endpoint }}"]
        insertafter: EOF

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        daemon_reload: true

    - name: Assert containerd is active
      ansible.builtin.systemd:
        name: containerd
      register: containerd_status
      failed_when: containerd_status.status.ActiveState != "active"
