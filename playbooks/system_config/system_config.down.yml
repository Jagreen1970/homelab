---
# System Configuration Down Playbook
# This playbook resets hostname, timezone, and locale settings

- name: Reset system configuration
  hosts: all
  become: true
  
  tasks:
    - name: Reset hostname to default
      ansible.builtin.hostname:
        name: "ubuntu"
        use: systemd
        
    - name: Reset /etc/hosts entry
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 ubuntu"
        state: present
        
    - name: Reset timezone to UTC
      community.general.timezone:
        name: UTC
        
    - name: Reset NTP configuration
      ansible.builtin.lineinfile:
        path: /etc/systemd/timesyncd.conf
        regexp: '^NTP='
        line: '#NTP='
        state: present
      notify: Restart timesyncd
        
  handlers:
    - name: Restart timesyncd
      ansible.builtin.service:
        name: systemd-timesyncd
        state: restarted