---
# Security Hardening Down Playbook
# This playbook reverses security hardening settings

- name: Reverse security hardening
  hosts: all
  remote_user: admin
  become: true
  
  tasks:
    - name: Include security variables
      ansible.builtin.include_vars:
        file: security_vars.yml
        name: security_vars
    
    # Remove Fail2ban
    - name: Stop and disable Fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: stopped
        enabled: no
      ignore_errors: yes
      
    - name: Remove Fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: absent
        purge: yes
      
    # Reset SSH to more permissive defaults
    - name: Reset SSH security settings
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^{{ item.key | regex_escape }} "
        line: "#{{ item.key }} {{ item.value }}"
        state: present
      loop: "{{ security_vars.ssh_settings | dict2items }}"
      notify: Restart SSH service
      
    # Reset UFW
    - name: Disable UFW
      community.general.ufw:
        state: disabled
      
    # Reset system security settings
    - name: Remove core dump limitation
      ansible.builtin.lineinfile:
        path: /etc/security/limits.conf
        line: "* hard core 0"
        state: absent
        
    - name: Reset kernel parameters
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: yes
        reload: yes
      loop:
        - { key: "kernel.randomize_va_space", value: "1" }
        - { key: "net.ipv4.conf.all.accept_redirects", value: "1" }
        - { key: "net.ipv4.conf.default.accept_redirects", value: "1" }
        - { key: "net.ipv4.conf.all.secure_redirects", value: "1" }
        - { key: "net.ipv4.conf.default.secure_redirects", value: "1" }
        - { key: "net.ipv4.conf.all.accept_source_route", value: "1" }
        - { key: "net.ipv4.conf.default.accept_source_route", value: "1" }
        - { key: "net.ipv4.icmp_echo_ignore_broadcasts", value: "0" }
        
    - name: Re-enable IPv6 if it was disabled
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "0"
        state: present
        sysctl_set: yes
        reload: yes
      with_items:
        - net.ipv6.conf.all.disable_ipv6
        - net.ipv6.conf.default.disable_ipv6
        - net.ipv6.conf.lo.disable_ipv6
      when: security_vars.disable_ipv6 | bool
      
  handlers:
    - name: Restart SSH service
      ansible.builtin.service:
        name: ssh
        state: restarted