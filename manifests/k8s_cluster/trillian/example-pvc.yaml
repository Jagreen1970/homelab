apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trillian-tiny-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-trillian
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trillian-small-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-trillian
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trillian-medium-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-trillian
  resources:
    requests:
      storage: 20Gi