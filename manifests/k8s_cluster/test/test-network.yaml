---
# test-network.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: network-test
---
apiVersion: v1
kind: Pod
metadata:
  name: network-test-1
  namespace: network-test
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: network-test-svc
  namespace: network-test
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: network-test-2
  namespace: network-test
  labels:
    app: nginx
spec:
  containers:
  - name: nginx
    image: nginx