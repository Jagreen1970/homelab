apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-test-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-distributed
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-storage-test
spec:
  containers:
  - name: volume-test
    image: nginx:stable-alpine
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c"]
    args:
    - echo "Longhorn distributed storage test successful on $(date)" > /data/longhorn-test.txt;
      echo "Testing node resilience with 3 replicas across worker nodes";
      echo "This file should survive even if the current node goes down" >> /data/longhorn-test.txt;
      tail -f /dev/null
    volumeMounts:
    - name: longhorn-test-volume
      mountPath: /data
  volumes:
  - name: longhorn-test-volume
    persistentVolumeClaim:
      claimName: longhorn-test-pvc