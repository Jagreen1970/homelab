apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  kubernetes-pod-logs.json: |
    {{ .Files.Get "grafana-dashboards/kubernetes-pod-logs.json" | indent 4 }}
  system-logs.json: |
    {{ .Files.Get "grafana-dashboards/system-logs.json" | indent 4 }}
  application-logs.json: |
    {{ .Files.Get "grafana-dashboards/application-logs.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: monitoring
data:
  dashboardproviders.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-dashboard-provisioner
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-dashboard-provisioner
  template:
    metadata:
      labels:
        app: grafana-dashboard-provisioner
    spec:
      containers:
      - name: grafana-dashboard-provisioner
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /var/lib/grafana/dashboards
          cp /etc/grafana/dashboards/*.json /var/lib/grafana/dashboards/
          while true; do sleep 3600; done
        volumeMounts:
        - name: dashboards
          mountPath: /etc/grafana/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: grafana-dashboards
        emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: grafana-dashboard-provisioner
  namespace: monitoring
spec:
  containers:
  - name: grafana-dashboard-provisioner
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
    - |
      mkdir -p /var/lib/grafana/dashboards
      cp /etc/grafana/dashboards/*.json /var/lib/grafana/dashboards/
      while true; do sleep 3600; done
    volumeMounts:
    - name: dashboards
      mountPath: /etc/grafana/dashboards
    - name: grafana-dashboards
      mountPath: /var/lib/grafana/dashboards
  volumes:
  - name: dashboards
    configMap:
      name: grafana-dashboards
  - name: grafana-dashboards
    emptyDir: {} 