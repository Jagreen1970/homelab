promtail:
  enabled: true
  config:
    logLevel: info
    serverPort: 3101
    clients:
      - url: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push

grafana:
  enabled: true
  image:
    tag: 12.0.2
  adminUser: admin
  adminPassword: admin
  service:
    type: NodePort
    port: 80
    nodePort: 30000
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    spec:
      ingressClassName: nginx
    hosts:
      - grafana.home
    paths:
      - /
    pathType: Prefix
  persistence:
    enabled: true
    size: 10Gi
    storageClass: nfs-storage
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://{{ .Release.Name }}-loki:3100
          basicAuth: false
          editable: true
          version: 1
  security:
    adminUser: admin
    adminPassword: admin
    allowEmbedding: true
    cookieSecure: false
    cookieSameSite: lax
    allowAnonymous: false
    disableGravatar: true
    strictTransportSecurity: false
    xFrameOptions: allow
    contentSecurityPolicy: "frame-ancestors 'self'"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
    httpGet:
      path: /api/health
      port: 3000
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
    httpGet:
      path: /api/health
      port: 3000

loki:
  enabled: true
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/cache
        cache_ttl: 24h
        shared_store: filesystem
      filesystem:
        directory: /loki/chunks
    limits_config:
      retention_period: 744h
      max_query_length: 721h
      split_queries_by_interval: 24h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 6
      per_stream_rate_limit: 10MB
      per_stream_rate_limit_burst: 20MB
  persistence:
    enabled: true
    size: 50Gi
    storageClass: nfs-storage
    accessModes:
      - ReadWriteOnce
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  extraVolumeMounts:
    - name: storage
      mountPath: /loki
  extraVolumes:
    - name: storage
      persistentVolumeClaim:
        claimName: storage-logging-stack-loki-0
