apiVersion: v1
kind: ConfigMap
metadata:
  name: node-local-storage-setup
  namespace: kube-system
data:
  setup-local-storage.sh: |
    #!/bin/bash
    set -e
    
    # Create the directory for local storage
    mkdir -p /mnt/k8s-data
    
    # Set appropriate permissions
    chmod 755 /mnt/k8s-data
    
    echo "Local storage setup completed on $(hostname)"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: local-storage-setup
  namespace: kube-system
spec:
  template:
    spec:
      hostNetwork: true
      containers:
      - name: local-storage-setup
        image: debian:bullseye-slim
        command: ["/bin/bash", "/scripts/setup-local-storage.sh"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: hostfs
          mountPath: /mnt
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: hostfs
        hostPath:
          path: /mnt
      - name: scripts
        configMap:
          name: node-local-storage-setup
          defaultMode: 0744
      restartPolicy: Never
  backoffLimit: 4