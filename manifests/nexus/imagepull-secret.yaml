# imagePullSecret for pulling from Nexus local Docker registry (docker.home)
#
# Generate this file with your actual credentials:
#   kubectl create secret docker-registry nexus-pull \
#     --docker-server=docker.home \
#     --docker-username=admin \
#     --docker-password=<nexus-admin-password> \
#     --dry-run=client -o yaml > manifests/nexus/imagepull-secret.yaml
#
# Apply to a namespace:
#   kubectl apply -f manifests/nexus/imagepull-secret.yaml -n <namespace>
#
# Auto-attach to default ServiceAccount in a namespace:
#   kubectl patch serviceaccount default -n <namespace> \
#     -p '{"imagePullSecrets": [{"name": "nexus-pull"}]}'
#
# NOTE: Do NOT commit the generated secret with real credentials to git.
#       Use Sealed Secrets, SOPS, or a secrets manager for storage.
#
# Placeholder — replace .dockerconfigjson with your base64-encoded value:
apiVersion: v1
kind: Secret
metadata:
  name: nexus-pull
  namespace: default
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_ME
