apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin-ingress
  namespace: postgres
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: "letsencrypt-prod" # Commented out for initial testing
spec:
  # TLS section commented out for initial testing
  # tls:
  #   - hosts:
  #       - pgadmin.local
  #     secretName: pgadmin-tls
  rules:
    - host: pgadmin.example.com  # Update this to your actual domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  number: 80
